<style id="css">
/* Layout: one reading column; checklist sections, then the stack and how it stays up. */
:root {
  --bg: #faf7f1; --surface: #efe8da; --line: #e2d8c4; --ink: #1e0c2c; --muted: #5b5260;
  --accent: #4b1c6b; --on-accent: #f4eee3; --gold: #b8995a; --gold-ink: #7a5c26; --done: #2f6b3c; --chapter: #4b1c6b; --chapter-bg: #ece2f2;
  --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #150820; --surface: #23112f; --line: #3a2650; --ink: #f4eee3; --muted: #c9bdd3;
  --accent: #c9a8e8; --on-accent: #150820; --gold: #d9c38f; --gold-ink: #d9c38f; --done: #9fd8ad; --chapter: #e0c9f2; --chapter-bg: #3a1f52; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #150820; --surface: #23112f; --line: #3a2650; --ink: #f4eee3; --muted: #c9bdd3;
  --accent: #c9a8e8; --on-accent: #150820; --gold: #d9c38f; --gold-ink: #d9c38f; --done: #9fd8ad; --chapter: #e0c9f2; --chapter-bg: #3a1f52; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 2px solid var(--gold); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.wm { height: 18px; width: auto; display: block; }
.wm.dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wm.light { display: none; } :root:not([data-theme="light"]) .wm.dark { display: block; } }
:root[data-theme="dark"] .wm.light { display: none; } :root[data-theme="dark"] .wm.dark { display: block; }
.chip { font: 12px/1 var(--mono); letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; white-space: nowrap; }
.chip.saving { color: var(--accent); border-color: var(--accent); }
.eyebrow { font: 12px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); }
h1 { font: 300 clamp(40px, 7vw, 64px)/1.02 var(--display); letter-spacing: -.03em; margin: 14px 0 18px; text-wrap: balance; }
h2 { font: 400 28px/1.15 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.lead { font-size: 18px; color: var(--muted); max-width: 62ch; margin: 0; }
.intro { padding-block: 48px 24px; }
.progress { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: center; margin-top: 32px; }
.progress .num { font: 300 44px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.progress .num small { font-size: 18px; color: var(--muted); }
.bar { height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 3px; transition: width .6s cubic-bezier(.2,.7,.2,1); }
.progress .cap { grid-column: 2; font-size: 13px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.filters button { font: 500 13px/1 var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.filters button:focus-visible, .item input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { margin-top: 18px; font-size: 14px; color: var(--muted); }
.terms { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; }
.terms span { font: 500 13px/1 var(--mono); padding: 9px 12px; border-radius: 6px; background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; }
.terms span:last-child { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 -2px 0 var(--gold); }
section.group { padding-block: 28px; border-top: 1px solid var(--gold); }
.ghead h2::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); margin-right: 14px; vertical-align: 5px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.ghead .count { font: 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.gsub { font-size: 14px; color: var(--muted); margin: 6px 0 12px; max-width: 62ch; }
ul.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: start; padding: 16px 0; border-bottom: 1px solid var(--line); }
.item label { display: contents; cursor: pointer; }
.item input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box { width: 22px; height: 22px; border: 1.5px solid var(--muted); border-radius: 6px; margin-top: 2px; display: grid; place-items: center; transition: background .2s, border-color .2s; }
.box svg { width: 14px; height: 14px; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1); }
.item input:checked + .box { background: var(--accent); border-color: var(--accent); }
.item input:checked + .box svg { opacity: 1; transform: none; }
.item input:disabled + .box { cursor: default; }
.txt { min-width: 0; }
.txt b { font-weight: 500; display: block; }
.txt span { display: block; font-size: 14px; color: var(--muted); margin-top: 3px; }
.txt em { display: block; font: normal 12px/1.4 var(--mono); color: var(--gold-ink); margin-top: 6px; }
.item.is-done .txt b { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.owner { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; white-space: nowrap; margin-top: 2px; }
.owner.chapter { color: var(--chapter); background: var(--chapter-bg); }
.owner.brandon { color: var(--bg); background: var(--ink); }
.owner.together { color: var(--gold-ink); border: 1px solid var(--gold); }
.stack { padding-block: 40px 8px; border-top: 1px solid var(--gold); }
.stack .gsub { margin-bottom: 20px; }
.phase { font: 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 26px 0 8px; }
.tool { display: grid; grid-template-columns: 170px 1fr; gap: 6px 24px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.tool b { font: 500 17px/1.3 var(--display); }
.tool p { margin: 0; font-size: 15px; }
.tool p span { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.keep { padding-block: 40px; border-top: 1px solid var(--gold); }
.keep ol { margin: 18px 0 0; padding: 0; list-style: none; counter-reset: k; display: grid; gap: 16px; }
.keep li { counter-increment: k; display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.keep li::before { content: counter(k, decimal-leading-zero); font: 13px/1.6 var(--mono); color: var(--gold-ink); }
.keep li b { font-weight: 500; }
.keep li span { color: var(--muted); }
footer { padding-block: 28px 56px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
footer .tm { display: block; margin-top: 8px; font-size: 12px; }
@media (max-width: 560px) {
  .item { grid-template-columns: 28px 1fr; }
  .item .owner { grid-column: 2; justify-self: start; margin-top: -4px; }
  .tool { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .bar i, .box, .box svg { transition: none; } }
</style>
